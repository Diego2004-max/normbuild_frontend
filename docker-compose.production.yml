services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: normbuild-web
    restart: unless-stopped
    environment:
      NORMBUILD_BACKEND_URL: ${NORMBUILD_BACKEND_URL:-http://normbuild-api:8080}
    networks:
      - edge

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - normbuild-caddy-data:/data
      - normbuild-caddy-config:/config
    depends_on:
      - web
    networks:
      - edge

volumes:
  normbuild-caddy-data:
  normbuild-caddy-config:

networks:
  edge:
    external: true
    name: normbuild-edge
