name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Validate production compose configuration
        env:
          PUBLIC_DOMAIN: normbuild.example.com
        run: docker compose -f docker-compose.production.yml config --quiet
      - name: Build frontend container
        run: docker build --tag normbuild-frontend:ci .
