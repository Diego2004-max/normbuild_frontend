name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Ensure secret environment files are not tracked
        run: |
          tracked_env_files="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -Ev '(^|/)\.env\.(example|production\.example)$' || true)"
          if [ -n "$tracked_env_files" ]; then
            echo "Unexpected tracked environment files: $tracked_env_files"
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Validate production compose configuration
        env:
          PUBLIC_DOMAIN: normbuild.example.com
        run: docker compose -f docker-compose.production.yml config --quiet
      - name: Build frontend container
        run: docker build --tag normbuild-frontend:ci .
